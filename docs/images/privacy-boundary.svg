<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">My Office privacy boundary</title>
  <desc id="desc">Allowed metadata stays inside the local application while prompts, tool arguments, results, and transcript paths are rejected.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17152a" flood-opacity=".14"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ded8f4"/>
    </pattern>
  </defs>
  <rect width="1200" height="470" rx="28" fill="#faf9ff"/>
  <rect width="1200" height="470" rx="28" fill="url(#dots)"/>
  <text x="60" y="68" fill="#27223d" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">隐私边界：只让必要的元数据通过</text>
  <text x="60" y="103" fill="#6c6680" font-family="Segoe UI, sans-serif" font-size="17">事件在本机解析，观测状态保存在内存，服务重启后清空</text>

  <g filter="url(#shadow)">
    <rect x="60" y="145" width="500" height="260" rx="22" fill="#fff" stroke="#a9ddc1" stroke-width="3"/>
    <rect x="60" y="145" width="500" height="58" rx="20" fill="#e5f6ec"/>
    <path d="M60 181V203H560V181" fill="#e5f6ec"/>
    <circle cx="99" cy="174" r="13" fill="#46aa79"/>
    <path d="M92 174l5 5 10-11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="182" fill="#246946" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">进入 My Office</text>
    <text x="92" y="244" fill="#3e4e46" font-family="Segoe UI, sans-serif" font-size="17">• 项目末级名称与脱敏标识</text>
    <text x="92" y="281" fill="#3e4e46" font-family="Segoe UI, sans-serif" font-size="17">• 客户端、事件类型、受限工具名</text>
    <text x="92" y="318" fill="#3e4e46" font-family="Segoe UI, sans-serif" font-size="17">• 分类枚举与事件时间</text>
    <text x="92" y="365" fill="#668074" font-family="Segoe UI, sans-serif" font-size="15">用于人物、状态、时间线与筛选</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="640" y="145" width="500" height="260" rx="22" fill="#fff" stroke="#efb2ad" stroke-width="3"/>
    <rect x="640" y="145" width="500" height="58" rx="20" fill="#fdecea"/>
    <path d="M640 181V203H1140V181" fill="#fdecea"/>
    <circle cx="679" cy="174" r="13" fill="#cf6258"/>
    <path d="M673 168l12 12m0-12l-12 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="706" y="182" fill="#913c35" font-family="Segoe UI, sans-serif" font-size="21" font-weight="700">拒绝接收或保存</text>
    <text x="672" y="244" fill="#594542" font-family="Segoe UI, sans-serif" font-size="17">• Prompt / 请求正文</text>
    <text x="672" y="281" fill="#594542" font-family="Segoe UI, sans-serif" font-size="17">• 工具参数、返回正文、错误正文</text>
    <text x="672" y="318" fill="#594542" font-family="Segoe UI, sans-serif" font-size="17">• 完整路径、委派内容、Transcript</text>
    <text x="672" y="365" fill="#816b68" font-family="Segoe UI, sans-serif" font-size="15">不读取历史日志，不进行离线重放</text>
  </g>
</svg>
